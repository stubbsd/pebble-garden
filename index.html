<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1a3d">
<title>Pebble Garden</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Pebbles">
</head>
<body>
<div id="safe"></div>
<canvas id="board" aria-label="Puzzle board"></canvas>

<div id="hud" class="hidden">
  <button id="btnMap" class="round" aria-label="Level map"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V20h-5v-5H9v5H4z"/></svg></button>
  <button id="btnUndo" class="round" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 7 4 11.5 9 16"/><path d="M4.5 11.5H15a5 5 0 0 1 0 10h-3"/></svg></button>
  <div id="levelNum" class="badge">1</div>
  <button id="btnRestart" class="round" aria-label="Restart"><svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.1-5"/><path d="M19 4v4.5h-4.5"/></svg></button>
</div>

<div id="map" class="screen">
  <div id="mapTop">
    <div class="title-pebbles"><i class="c0"></i><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i></div>
    <div class="topBtns"><button id="btnReset" class="pill" aria-label="Reset progress"><svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.1-5"/><path d="M19 4v4.5h-4.5"/></svg>Reset</button>
    <button id="btnSound" class="round" aria-label="Sound on or off"><svg viewBox="0 0 24 24"><path d="M4 9.5h4L13 5v14l-5-4.5H4z"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="cross" d="M16 9l6 6M22 9l-6 6"/></svg></button></div>
  </div>
  <div id="mapScroll"><div id="mapPath"></div></div>
</div>

<div id="confirm" class="hidden" role="dialog" aria-modal="true" aria-labelledby="confirmText">
  <div class="card">
    <div id="confirmText">Reset all progress?<small>Stars and unlocked levels will be cleared.</small></div>
    <div class="row">
      <button id="resetNo" class="round big" aria-label="No, keep progress"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <button id="resetYes" class="round big warn" aria-label="Yes, reset"><svg viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7"/></svg></button>
    </div>
  </div>
</div>

<div id="win" class="hidden">
  <div class="card">
    <div id="winStars"><span></span><span></span><span></span></div>
    <div class="row">
      <button id="winMap" class="round big" aria-label="Level map"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V20h-5v-5H9v5H4z"/></svg></button>
      <button id="winAgain" class="round big" aria-label="Play again"><svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.1-5"/><path d="M19 4v4.5h-4.5"/></svg></button>
      <button id="winNext" class="round huge go" aria-label="Next level"><svg viewBox="0 0 24 24"><path d="M5 12h13"/><path d="M12 5.5 18.5 12 12 18.5"/></svg></button>
    </div>
  </div>
</div>

<script src="src/engine.js"></script>
<script src="src/levels.js"></script>
<script src="src/audio.js"></script>
<script src="src/animals.js"></script>
<script src="src/game.js"></script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:' || location.hostname === 'localhost') navigator.serviceWorker && navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
